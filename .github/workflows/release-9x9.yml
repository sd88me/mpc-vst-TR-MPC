# Build 9X9 (Gen2 only) into a DRAFT release (9x9-vst-v<version>) with mpc-vst-plugins' shared workflow:
# Actions -> "Release 9X9 (draft)" -> Run workflow. Install that draft's zip on a Gen2 device, smoke-test it, then publish
# the draft (mpc-vst-plugins docs/RELEASING.md). dry_run builds the zip and skin previews as run artifacts only.
name: Release 9X9 (draft)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, e.g. 1.0.0
        required: true
      dry_run:
        description: Build only (zip + skin previews as run artifacts), no draft release
        type: boolean
        default: false

jobs:
  tr_9x9:
    uses: open-mpc/mpc-vst-plugins/.github/workflows/vst-release.yml@122ac4eece1de334ab452725751adbe9b01d0359
    permissions:
      contents: write
    with:
      tag: 9x9-vst-v${{ inputs.version }}
      version: ${{ inputs.version }}
      tools_ref: 122ac4eece1de334ab452725751adbe9b01d0359
      vst_dir: ports/9x9
      build: SHADOW_SKIN_MPC_OS=2 bash tools/build_ci.sh 9x9
      host_test: bash tools/test_ci.sh 9x9
      plugin_id: tr-9x9
      license: AGPL-3.0-only
      about: Circuit-solved TR-909 (Lemus) with 9W9's panel, drive, distortion and effects, for MPC Gen2.
      gen2_only: true
      extra: ports/9w9/src/samples:engine/samples ports/9x9/roms/README.txt:engine/roms/README.txt
      user_data: engine/roms
      requires: Your own copies of the three 909 hat, crash and ride ROMs (optional; without them 9W9 samples play)
      dry_run: ${{ inputs.dry_run }}
